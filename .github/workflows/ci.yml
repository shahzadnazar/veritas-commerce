name: CI

on:
    push:
        branches: ['**']
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: veritas_test
                    POSTGRES_USER: veritas
                    POSTGRES_PASSWORD: veritas
                ports: ['5432:5432']
                options: >-
                    --health-cmd="pg_isready -U veritas"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

            redis:
                image: redis:7
                ports: ['6379:6379']
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=5s
                    --health-timeout=3s
                    --health-retries=10

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache
                  key: composer-${{ hashFiles('composer.lock') }}

            - run: composer install --no-interaction --prefer-dist --no-progress

            # The suite renders the product page through the real SSR
            # bundle in a node process, so the bundle has to exist here as
            # well as in the frontend job. Skipping the test instead would
            # mean a green suite that quietly stopped checking the markup a
            # crawler actually receives.
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - run: npm ci

            - name: Build the SSR bundle
              run: npm run build:ssr

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            # Migrations must run cleanly on an empty database, every time.
            - name: Migrate a clean database
              run: php artisan migrate:fresh --seed --force
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_DATABASE: veritas_test
                  DB_USERNAME: veritas
                  DB_PASSWORD: veritas

            - name: Code style
              run: ./vendor/bin/pint --test

            # Larastan installs normally on a runner, so this is the strict
            # configuration: level 8, with the Laravel-aware rules. The
            # level 6 fallback in phpstan.neon is never selected here and
            # cannot hide a finding from CI.
            - name: Static analysis
              run: |
                  test -f vendor/larastan/larastan/extension.neon \
                      || { echo "Larastan is missing; CI must run the strict configuration."; exit 1; }
                  php tools/phpstan.php analyse --memory-limit=2G --no-progress

            # The architectural invariants run first and on their own: if
            # money or tenant isolation is broken, nothing else in the suite
            # is interesting.
            - name: Architectural invariants
              run: ./vendor/bin/phpunit --testsuite=Invariants

            - name: Full test suite
              run: ./vendor/bin/phpunit

    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - run: npm ci

            - name: Type check
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Production build
              run: npm run build:ssr

    docker:
        name: Docker environment
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Build images
              run: docker compose build

            - name: Start the stack
              run: |
                  cp .env.example .env
                  docker compose up -d postgres redis
                  docker compose run --rm app composer install --no-interaction --prefer-dist
                  docker compose run --rm app php artisan key:generate

                  # The storefront is server-rendered, so the SEO smoke
                  # below needs the SSR process as well as the PHP one.
                  # Enabled here rather than in .env.example because a
                  # developer without the bundle built should still get a
                  # working page.
                  echo 'INERTIA_SSR_ENABLED=true' >> .env
                  echo 'INERTIA_SSR_URL=http://ssr:13714' >> .env

                  docker compose run --rm vite sh -c 'npm ci && npm run build:ssr'
                  docker compose up -d ssr app
                  docker compose ps

            - name: Wait for the application to answer
              run: |
                  for attempt in $(seq 1 30); do
                    if curl -fsS http://127.0.0.1:8000/up > /dev/null; then
                      echo "Application is up after ${attempt} attempt(s)."
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "Application never became reachable."
                  docker compose logs app
                  exit 1

            - name: Migrate and smoke-test over HTTP
              run: |
                  docker compose exec -T app php artisan migrate:fresh --seed --force
                  curl -fsS -o /dev/null -w 'storefront %{http_code}\n' http://127.0.0.1:8000/
                  curl -fsS -o /dev/null -w 'sign in %{http_code}\n' http://127.0.0.1:8000/login
                  curl -fsS -o /dev/null -w 'register %{http_code}\n' http://127.0.0.1:8000/register
                  curl -fsS -o /dev/null -w 'admin login %{http_code}\n' http://127.0.0.1:8000/admin/login
                  curl -fsS -o /dev/null -w 'health %{http_code}\n' http://127.0.0.1:8000/up
                  # A guest is sent to the right sign-in page for the realm.
                  test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8000/admin)" = "http://127.0.0.1:8000/admin/login"
                  test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8000/seller)" = "http://127.0.0.1:8000/login"
                  # An unknown store is a 404, not a shell.
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/stores/nothing-here)" = "404"

            # The catalogue is the point of M2, so the built image has to
            # serve a real product page — not just the shell. A published
            # product is created through the same models the application
            # uses, then fetched the way a crawler would.
            - name: A canonical product page is served with its SEO markup
              run: |
                  # Written to a file first, deliberately. Piping the seed
                  # straight into `tr` discarded its exit status, so a
                  # seeding failure surfaced as a confusing curl error
                  # three steps later instead of a failed step.
                  docker compose exec -T app php artisan veritas:seed-demo-catalogue --offers=2 > seeded.txt
                  slug=$(grep '^product=' seeded.txt | cut -d= -f2 | tr -d '\r')
                  test -n "$slug"

                  body=$(curl -fsS "http://127.0.0.1:8000/products/${slug}")

                  # Server-rendered, so all of this is in the first
                  # response — which is the only one a crawler makes.
                  test "$(echo "$body" | grep -c '<title')" = "1"
                  echo "$body" | grep -q 'Aeris Cordless Kettle'
                  echo "$body" | grep -q 'rel="canonical"'
                  echo "$body" | grep -q 'application/ld+json'
                  echo "$body" | grep -q '"@type":"Product"'
                  # Truthfulness, not presence: nothing may claim a rating
                  # or a review the database cannot support.
                  ! echo "$body" | grep -q 'aggregateRating'
                  ! echo "$body" | grep -q '"review"'
                  # A storefront page is indexable; the portals are not.
                  ! curl -sD - -o /dev/null "http://127.0.0.1:8000/products/${slug}" | grep -qi 'X-Robots-Tag'
                  # Availability is the inventory ledger's answer, not an
                  # assumption: the seeded product is stocked, so a claim
                  # of OutOfStock here would mean the two have diverged.
                  echo "$body" | grep -q '"availability":"https://schema.org/InStock"'
                  # An unpublished product has no page at all.
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/products/not-a-real-product)" = "404"

            # M3's discovery surfaces, on the built image.
            - name: Search, category and store pages answer
              run: |
                  category=$(grep '^category=' seeded.txt | cut -d= -f2 | tr -d '\r')
                  store=$(grep '^store=' seeded.txt | cut -d= -f2 | tr -d '\r')

                  # The index is built by a queued job; the smoke runs it
                  # directly so it does not race the worker.
                  docker compose exec -T app php artisan tinker --execute \
                      'foreach (\App\Modules\Catalog\Models\Product::query()->pluck("id") as $id) { \App\Modules\Search\Jobs\ReindexProduct::dispatchSync((int) $id); }'

                  curl -fsS -o /dev/null -w 'category %{http_code}\n' "http://127.0.0.1:8000/categories/${category}"
                  curl -fsS -o /dev/null -w 'store %{http_code}\n' "http://127.0.0.1:8000/stores/${store}"

                  search=$(curl -fsS 'http://127.0.0.1:8000/search?q=Aeris')
                  echo "$search" | grep -q 'Aeris Cordless Kettle'

                  # Typo tolerance, on the real trigram index.
                  curl -fsS 'http://127.0.0.1:8000/search?q=Aeriss' | grep -q 'Aeris Cordless Kettle'

                  # Autocomplete answers, and only with published rows.
                  curl -fsS 'http://127.0.0.1:8000/search/suggestions?q=aer' | grep -q 'Aeris Cordless Kettle'

                  # Search is never indexable — the header survives even a
                  # misconfigured SSR process.
                  curl -sD - -o /dev/null 'http://127.0.0.1:8000/search?q=Aeris' | grep -qi 'X-Robots-Tag: noindex'

                  # A clean category page is the canonical thing; a faceted
                  # one is not, or one category becomes six hundred pages.
                  curl -fsS "http://127.0.0.1:8000/categories/${category}" | grep -q 'content="index, follow"'
                  curl -fsS "http://127.0.0.1:8000/categories/${category}?in_stock=1" | grep -q 'content="noindex, follow"'

            - name: Sitemaps list only what resolves
              run: |
                  slug=$(grep '^product=' seeded.txt | cut -d= -f2 | tr -d '\r')

                  curl -fsS http://127.0.0.1:8000/sitemap.xml | grep -q 'products-sitemap.xml'
                  curl -fsS http://127.0.0.1:8000/products-sitemap.xml | grep -q "/products/${slug}"
                  curl -fsS http://127.0.0.1:8000/categories-sitemap.xml | grep -q '/categories/'
                  curl -fsS http://127.0.0.1:8000/stores-sitemap.xml | grep -q '/stores/'

                  # Nothing a crawler should not be asking for.
                  ! curl -fsS http://127.0.0.1:8000/products-sitemap.xml | grep -q '/search'
                  ! curl -fsS http://127.0.0.1:8000/products-sitemap.xml | grep -q '/admin'

                  curl -fsS http://127.0.0.1:8000/robots.txt | grep -q 'Disallow: /search'
                  curl -fsS http://127.0.0.1:8000/robots.txt | grep -q 'Sitemap: '

            # M4's commerce path, on the built image: a real basket, a
            # real checkout and a real payment-pending order, plus the
            # isolation that has to hold around them. Controller tests
            # cannot prove any of this against a production build.
            - name: A customer can fill a basket and reach a payment-pending order
              run: |
                  # Known accounts and a stocked offer, created through the
                  # same models the application uses. Written to a file so
                  # a seeding failure fails THIS step rather than a curl
                  # three steps later.
                  docker compose exec -T app php artisan tinker --execute \
                      'require "/var/www/html/.github/ci/m4-smoke-seed.php";' > m4.txt
                  cat m4.txt
                  offer=$(grep '^offer=' m4.txt | cut -d= -f2 | tr -d '\r')
                  test -n "$offer"

                  jar=$(mktemp)
                  base=http://127.0.0.1:8000
                  xsrf() { grep XSRF-TOKEN "$jar" | awk '{print $7}' | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))'; }

                  # Anonymous first: the basket is open to everyone, and
                  # every transactional page must refuse a crawler.
                  curl -fsS -b "$jar" -c "$jar" -o /dev/null "$base/cart"
                  curl -sD - -o /dev/null -b "$jar" "$base/cart" | grep -qi 'X-Robots-Tag: noindex, nofollow'

                  curl -fsS -b "$jar" -c "$jar" -o /dev/null "$base/login"
                  test "$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST "$base/login" \
                      -H "X-XSRF-TOKEN: $(xsrf)" \
                      -d 'email=m4-customer@veritas.test' -d 'password=m4-smoke-password')" = "302"

                  test "$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST "$base/cart" \
                      -H "X-XSRF-TOKEN: $(xsrf)" -d "offer=${offer}" -d 'quantity=2')" = "302"

                  # Server-rendered, so the basket is in the first response.
                  cart=$(curl -fsS -b "$jar" -c "$jar" "$base/cart")
                  test "$(echo "$cart" | grep -c '<title')" = "1"
                  echo "$cart" | grep -q 'M4 Smoke Kettle'
                  echo "$cart" | grep -q 'M4 Smoke Store'
                  echo "$cart" | grep -q '\$90.00'
                  echo "$cart" | grep -q 'Continue to checkout'

                  curl -fsS -b "$jar" -c "$jar" -o /dev/null "$base/checkout"

                  location=$(curl -sD - -o /dev/null -b "$jar" -c "$jar" -X POST "$base/checkout" \
                      -H "X-XSRF-TOKEN: $(xsrf)" \
                      -d 'idempotency_key=m4smokekey123456' -d 'email=m4-customer@veritas.test' \
                      -d 'name=M4 Customer' -d 'line1=1 Test Way' -d 'city=London' \
                      -d 'postcode=EC1A 1BB' -d 'country=GB' \
                      | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
                  test -n "$location"
                  ref=$(echo "$location" | sed 's#.*/checkout/##;s#/payment##')
                  echo "order $ref"

                  # The boundary, in the page's own words: an order exists
                  # and nothing has been paid. The page offers to take the
                  # payment and claims nothing about having taken it.
                  pending=$(curl -fsS -b "$jar" -c "$jar" "$location")
                  echo "$pending" | grep -qi 'Pay for this order'
                  echo "$pending" | grep -qi 'Nothing has been charged yet'
                  ! echo "$pending" | grep -qi 'payment successful'
                  ! echo "$pending" | grep -qi 'Order confirmed'
                  ! echo "$pending" | grep -qi 'Payment received'

                  # And the stock is HELD, not sold: on_hand untouched,
                  # availability down by two.
                  docker compose exec -T app php artisan tinker --execute \
                      'require "/var/www/html/.github/ci/m4-holds.php";' > holds.txt
                  cat holds.txt
                  grep -q 'holds on_hand=25 reserved=2 available=23 status=pending_payment' holds.txt

                  order=$(curl -fsS -b "$jar" -c "$jar" "$base/account/orders/${ref}")
                  echo "$order" | grep -q 'M4 Smoke Kettle'
                  echo "$order" | grep -q "${ref}-01"

                  # A resubmission of the same key is the same checkout.
                  curl -s -b "$jar" -c "$jar" -o /dev/null -X POST "$base/checkout" \
                      -H "X-XSRF-TOKEN: $(xsrf)" \
                      -d 'idempotency_key=m4smokekey123456' -d 'email=m4-customer@veritas.test' \
                      -d 'name=M4 Customer' -d 'line1=1 Test Way' -d 'city=London' \
                      -d 'postcode=EC1A 1BB' -d 'country=GB'
                  docker compose exec -T app php artisan tinker --execute \
                      'echo "orders=".\App\Modules\Orders\Models\MarketplaceOrder::query()->count();' \
                      | grep -q 'orders=1'

                  echo "$ref" > m4-ref.txt

            - name: A seller sees only their half, and nobody else reaches it
              run: |
                  ref=$(cat m4-ref.txt)
                  base=http://127.0.0.1:8000
                  login() {
                      jar=$1; email=$2
                      curl -fsS -b "$jar" -c "$jar" -o /dev/null "$base/login"
                      t=$(grep XSRF-TOKEN "$jar" | awk '{print $7}' | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))')
                      curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST "$base/login" \
                          -H "X-XSRF-TOKEN: $t" -d "email=$email" -d 'password=m4-smoke-password'
                  }

                  seller=$(mktemp); other=$(mktemp); stranger=$(mktemp)
                  test "$(login "$seller" m4-seller@veritas.test)" = "302"
                  test "$(login "$other" m4-other-seller@veritas.test)" = "302"
                  test "$(login "$stranger" m4-stranger@veritas.test)" = "302"

                  curl -fsS -b "$seller" -c "$seller" "$base/seller/orders" | grep -q "${ref}-01"
                  curl -fsS -b "$seller" -c "$seller" -o /dev/null "$base/seller/orders/${ref}-01"

                  # An unpaid seller order is visible and not actionable.
                  curl -fsS -b "$seller" -c "$seller" "$base/seller/orders/${ref}-01" \
                      | grep -q 'cannot be packed or shipped until payment is confirmed'

                  # The parent number is printed on the page; it is not a
                  # route into the parent.
                  test "$(curl -s -b "$seller" -o /dev/null -w '%{http_code}' "$base/seller/orders/${ref}")" = "404"

                  # Another seller reaches none of it, by URL or by search.
                  test "$(curl -s -b "$other" -o /dev/null -w '%{http_code}' "$base/seller/orders/${ref}-01")" = "404"
                  ! curl -fsS -b "$other" "$base/seller/orders?parent=${ref}" | grep -q "${ref}-01"

                  # And neither does another customer.
                  test "$(curl -s -b "$stranger" -o /dev/null -w '%{http_code}' "$base/account/orders/${ref}")" = "404"
                  test "$(curl -s -b "$stranger" -o /dev/null -w '%{http_code}' "$base/checkout/${ref}/payment")" = "404"

                  # Every private path refuses a crawler.
                  for path in /cart /checkout "/checkout/${ref}/payment" /account/orders "/account/orders/${ref}" /seller/orders "/seller/orders/${ref}-01"; do
                      curl -sD - -o /dev/null -b "$seller" "${base}${path}" | grep -qi 'X-Robots-Tag: noindex, nofollow'
                  done

            - name: The unpaid order gives its stock back, once
              run: |
                  # The scheduled sweep, against real order data, run twice.
                  docker compose exec -T app php artisan tinker --execute \
                      'require "/var/www/html/.github/ci/m4-expire.php";' > expire.txt
                  cat expire.txt
                  grep -q 'order=cancelled' expire.txt
                  grep -q 'seller=cancelled' expire.txt
                  grep -q 'reserved=0' expire.txt
                  grep -q 'on_hand=25' expire.txt
                  grep -q 'releases=1' expire.txt
                  grep -q 'sales=0' expire.txt
                  grep -q 'ledger=0' expire.txt

            - name: A payment is verified, recorded and reversed in the built image
              run: |
                  # The financial machinery against the real PostgreSQL and
                  # the real Redis: preparation, a forged signature, a
                  # decline, a retry, verification, replay, reconciliation
                  # and a reversal. Driven in-process because the fake
                  # provider holds its payments in memory and a php-fpm
                  # worker's are not another worker's; the HTTP surface is
                  # smoked separately below.
                  docker compose exec -T app php artisan tinker --execute \
                      'require "/var/www/html/.github/ci/m5-payment-smoke.php";' > m5.txt
                  cat m5.txt

                  # The provider is told the order's own total, once.
                  grep -q 'prepared amount=9000 order_total=9000 currency=USD' m5.txt
                  grep -q 'idempotent attempts=1 same=yes' m5.txt

                  # A forged signature is refused and nothing is stored.
                  grep -q 'forged status=400 stored=0' m5.txt

                  # A decline leaves the order payable — §20.
                  grep -q 'declined order_status=pending_payment attempt_status=failed' m5.txt

                  # The retry is verified, and three deliveries are one
                  # capture and one movement.
                  grep -q 'paid status=200 order=paid payments=1 transactions=1' m5.txt
                  grep -q 'seller_orders=paid' m5.txt

                  # The money adds up exactly, and the seller cannot spend
                  # it: pending, with no availability date — §33.
                  grep -q 'exact=yes' m5.txt
                  grep -q 'earning status=pending available_at=null' m5.txt

                  # The refund reverses once, and the net position is zero.
                  grep -q 'refund status=succeeded reversals=1' m5.txt
                  grep -q 'net earnings=0 commission=0 payment_refunded=9000' m5.txt

            - name: The payment surfaces answer over HTTP and give nothing away
              run: |
                  base=http://127.0.0.1:8000
                  ref=$(grep '^order_reference=' m5.txt | cut -d= -f2 | tr -d '\r')
                  test -n "$ref"

                  jar=$(mktemp)
                  xsrf() { grep XSRF-TOKEN "$jar" | awk '{print $7}' | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))'; }

                  curl -fsS -b "$jar" -c "$jar" -o /dev/null "$base/login"
                  test "$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST "$base/login" \
                      -H "X-XSRF-TOKEN: $(xsrf)" \
                      -d 'email=m4-customer@veritas.test' -d 'password=m4-smoke-password')" = "302"

                  # The paid order says so, in the platform's own words,
                  # and the page is server-rendered so a crawler-shaped
                  # request sees the same thing a browser does.
                  paid=$(curl -fsS -b "$jar" -c "$jar" "$base/checkout/${ref}/payment")
                  echo "$paid" | grep -qi 'Order confirmed'
                  echo "$paid" | grep -qi 'Payment received'
                  ! echo "$paid" | grep -q 'fake_pi_'
                  ! echo "$paid" | grep -q 'clientSecret'
                  ! echo "$paid" | grep -qE 'sk_(test|live)_'
                  ! echo "$paid" | grep -q 'whsec_'

                  # The status endpoint reports the database, never the URL.
                  status=$(curl -fsS -b "$jar" -c "$jar" -H 'Accept: application/json' \
                      "$base/checkout/${ref}/payment/status?redirect_status=failed")
                  echo "$status" | grep -q '"isPaid":true'

                  # A forged webhook over the wire is refused outright.
                  test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/webhooks/payments" \
                      -H 'Stripe-Signature: v1=deadbeef' -H 'Content-Type: application/json' \
                      -d '{"id":"evt_http_forged","type":"payment_intent.succeeded","data":{"object":{"id":"pi_x"}}}')" = "400"

                  # An unsigned one too — and neither is stored.
                  test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/webhooks/payments" \
                      -H 'Content-Type: application/json' \
                      -d '{"id":"evt_http_unsigned","type":"payment_intent.succeeded","data":{"object":{"id":"pi_x"}}}')" = "400"

                  docker compose exec -T app php artisan tinker --execute \
                      'echo "forged_stored=".\App\Modules\Payments\Models\ProviderWebhookEvent::query()->whereIn("event_id", ["evt_http_forged", "evt_http_unsigned"])->count();' \
                      | grep -q 'forged_stored=0'

                  # Transactional payment pages are never a search result.
                  for path in "/checkout/${ref}/payment" "/account/orders/${ref}"; do
                      curl -sD - -o /dev/null -b "$jar" "${base}${path}" | grep -qi 'X-Robots-Tag: noindex, nofollow'
                  done

            - name: An order is fulfilled, delivered and cleared in the built image
              run: |
                  # The whole fulfilment lifecycle against the container's
                  # real PostgreSQL and Redis, through the domain actions
                  # the seller portal calls: confirm, pack, ship, deliver,
                  # clear, complete — plus a two-seller order, because
                  # delivering one seller leaving the other alone is the
                  # part only a marketplace has to get right.
                  docker compose exec -T app php artisan tinker --execute \
                      'require "/var/www/html/.github/ci/m6-fulfilment-smoke.php";' > m6.txt
                  cat m6.txt

                  # Fulfilment starts from a paid order and walks forward.
                  grep -q 'paid seller_order=.* status=paid' m6.txt
                  grep -q 'shipped shipment=.*-S01 status=shipped order=shipped carrier=UPS' m6.txt

                  # §17: the sale took the stock at payment. Shipping is
                  # fulfilment state, not a second debit.
                  grep -qE 'inventory after_payment=([0-9]+) after_shipping=\1$' m6.txt

                  # Delivery starts a clock and makes nothing spendable.
                  grep -q 'delivered status=delivered' m6.txt
                  grep -q 'clearing pending=0 clearing=7920 available=0' m6.txt

                  # The real scheduled command: nothing before the date,
                  # everything on it, and nothing again afterwards.
                  grep -q 'early_sweep released=0 completed=0' m6.txt
                  grep -q 'sweep released=1 completed=1' m6.txt
                  grep -q 'resweep released=0 completed=0' m6.txt
                  grep -q 'cleared available=7920 clearing=0 order_status=completed' m6.txt

                  # Two sellers, delivered one at a time.
                  grep -q 'multi seller_orders=2' m6.txt
                  grep -q 'first_delivered a=delivered b=paid parent=partially_delivered' m6.txt
                  grep -q 'independent_clocks a=.* b=null' m6.txt
                  grep -q 'both_delivered a=delivered b=delivered parent=delivered' m6.txt

            - name: The fulfilment surfaces answer over HTTP and stay private
              run: |
                  base=http://127.0.0.1:8000
                  order=$(grep '^order_reference=' m6.txt | cut -d= -f2 | tr -d '\r')
                  sellerOrder=$(grep '^seller_order_reference=' m6.txt | cut -d= -f2 | tr -d '\r')
                  test -n "$order" && test -n "$sellerOrder"

                  xsrf() { grep XSRF-TOKEN "$1" | awk '{print $7}' | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))'; }

                  # The customer sees their own tracking, per seller.
                  jar=$(mktemp)
                  curl -fsS -b "$jar" -c "$jar" -o /dev/null "$base/login"
                  test "$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST "$base/login" \
                      -H "X-XSRF-TOKEN: $(xsrf "$jar")" \
                      -d 'email=m4-customer@veritas.test' -d 'password=m4-smoke-password')" = "302"

                  tracking=$(curl -fsS -b "$jar" -c "$jar" "$base/account/orders/${order}")
                  echo "$tracking" | grep -qi 'Where your order is'
                  echo "$tracking" | grep -q "${sellerOrder}"
                  echo "$tracking" | grep -qi 'UPS'

                  # The seller sees their own fulfilment screen.
                  seller=$(mktemp)
                  curl -fsS -b "$seller" -c "$seller" -o /dev/null "$base/login"
                  test "$(curl -s -b "$seller" -c "$seller" -o /dev/null -w '%{http_code}' -X POST "$base/login" \
                      -H "X-XSRF-TOKEN: $(xsrf "$seller")" \
                      -d 'email=m4-seller@veritas.test' -d 'password=m4-smoke-password')" = "302"

                  fulfilment=$(curl -fsS -b "$seller" -c "$seller" "$base/seller/orders/${sellerOrder}")
                  echo "$fulfilment" | grep -qi 'Fulfilment'
                  echo "$fulfilment" | grep -q "${sellerOrder}-S01"

                  # A stranger reaches neither, and nothing is indexable.
                  stranger=$(mktemp)
                  curl -fsS -b "$stranger" -c "$stranger" -o /dev/null "$base/login"
                  curl -s -b "$stranger" -c "$stranger" -o /dev/null -X POST "$base/login" \
                      -H "X-XSRF-TOKEN: $(xsrf "$stranger")" \
                      -d 'email=m4-stranger@veritas.test' -d 'password=m4-smoke-password'

                  test "$(curl -s -b "$stranger" -o /dev/null -w '%{http_code}' "$base/account/orders/${order}")" = "404"
                  test "$(curl -s -b "$stranger" -o /dev/null -w '%{http_code}' "$base/seller/orders/${sellerOrder}")" = "404"

                  # §44: an order number is not a credential.
                  test "$(curl -s -o /dev/null -w '%{http_code}' "$base/account/orders/${order}")" = "302"
                  test "$(curl -s -o /dev/null -w '%{http_code}' "$base/track/${order}")" = "404"

                  for path in "/account/orders/${order}" "/seller/orders/${sellerOrder}"; do
                      curl -sD - -o /dev/null -b "$jar" -b "$seller" "${base}${path}" | grep -qi 'X-Robots-Tag: noindex, nofollow'
                  done

                  # And a customer cannot move a parcel.
                  test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' -X POST \
                      "$base/seller/orders/${sellerOrder}/confirm")" = "404"

            - name: The admin payment screens require the permission that opens them
              run: |
                  base=http://127.0.0.1:8000
                  ref=$(grep '^order_reference=' m5.txt | cut -d= -f2 | tr -d '\r')

                  # A signed-out request is redirected, not answered.
                  test "$(curl -s -o /dev/null -w '%{http_code}' "$base/admin/payments")" = "302"
                  test "$(curl -s -o /dev/null -w '%{http_code}' "$base/admin/payments/${ref}")" = "302"

                  # And a customer session is not an admin session.
                  jar=$(mktemp)
                  xsrf() { grep XSRF-TOKEN "$jar" | awk '{print $7}' | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))'; }
                  curl -fsS -b "$jar" -c "$jar" -o /dev/null "$base/login"
                  curl -s -b "$jar" -c "$jar" -o /dev/null -X POST "$base/login" \
                      -H "X-XSRF-TOKEN: $(xsrf)" \
                      -d 'email=m4-customer@veritas.test' -d 'password=m4-smoke-password'
                  test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' "$base/admin/payments")" = "302"

                  # The refund route refuses an unauthenticated post too —
                  # money never moves without a session that may move it.
                  test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/admin/payments/${ref}/refunds" \
                      -d 'reason=trying it on' -d 'lines[0][order_item_id]=1' -d 'lines[0][amount_minor]=100')" = "302"

            - name: A payout is requested, approved, settled and refunded in the built image
              run: |
                  # The whole payout lifecycle against the container's real
                  # PostgreSQL and Redis, through the domain actions the
                  # portals call: earn, clear, request, reserve, review,
                  # approve, settle — then a refund lands behind the money
                  # that already left. One order with two sellers, so
                  # "the other seller was untouched" is a claim about a
                  # store that was genuinely in the way.
                  docker compose exec -T app php artisan tinker --execute \
                      'require "/var/www/html/.github/ci/m7-payout-smoke.php";' > m7.txt
                  cat m7.txt

                  grep -q 'order=VC-.* sellers=2' m7.txt

                  # Delivered and swept: both stores have money, neither
                  # has anything held.
                  grep -q 'cleared a_available=15840 a_withdrawable=15840 a_reserved=0 b_withdrawable=5280' m7.txt

                  # §4: the request holds the money without moving the
                  # ledger. Available is historically unchanged.
                  grep -q 'requested payout=PO-.* amount=7920 reserved=7920 withdrawable=7920 available=15840' m7.txt

                  # §24: approval authorises a transfer and makes none.
                  grep -q 'approved status=approved reserved=7920 debits=0' m7.txt

                  # §29 and §53: settling closes the hold AND posts exactly
                  # one debit, and subtracts once — 15,840 less 7,920
                  # leaves 7,920, not -7,920 and not 15,840. Recorded three
                  # times over, because a retried job must not pay twice.
                  grep -q 'settled status=paid reserved=0 withdrawable=7920 paid_out=7920 debits=1 ref=CI-FT-0001' m7.txt

                  # §85: the other seller in the same order is untouched.
                  grep -q 'isolation_after_payout b_withdrawable=5280 b_paid_out=0 b_payouts=0' m7.txt

                  # §42: a refund lands behind the money that already left.
                  # Neither historical record moves and the store ends up
                  # owing the platform — 15,840 less 7,920 paid less
                  # 11,880 refunded is -3,960.
                  # The signed capacity says how far short; withdrawable
                  # is clamped and says nothing may be asked for.
                  grep -q 'post_refund a_net=-3960 a_capacity=-3960 a_withdrawable=0 a_paid_out=7920 payout_status=paid payout_amount=7920' m7.txt
                  grep -q 'isolation_after_refund b_net=5280 b_withdrawable=5280' m7.txt

                  # §48: and nothing further can be withdrawn.
                  grep -q 'blocked reason=negative_balance' m7.txt

                  # §41 and §89: after all of that, the money still adds up.
                  grep -q 'reconcile problems=0' m7.txt
                  grep -q 'reconcile_command Seller finance reconciles in USD.' m7.txt
                  ! grep -q 'reconcile_problem' m7.txt

            - name: The finance surfaces answer over HTTP and stay private
              run: |
                  base=http://127.0.0.1:8000
                  payout=$(grep '^payout_reference=' m7.txt | cut -d= -f2 | tr -d '\r')
                  test -n "$payout"

                  xsrf() { grep XSRF-TOKEN "$1" | awk '{print $7}' | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))'; }

                  # The seller sees their own statement and their payout.
                  seller=$(mktemp)
                  curl -fsS -b "$seller" -c "$seller" -o /dev/null "$base/login"
                  test "$(curl -s -b "$seller" -c "$seller" -o /dev/null -w '%{http_code}' -X POST "$base/login" \
                      -H "X-XSRF-TOKEN: $(xsrf "$seller")" \
                      -d 'email=m7-seller@veritas.test' -d 'password=m4-smoke-password')" = "302"

                  # SSR is storefront-only by design, so the portal's
                  # assertions are made against the props the server sent
                  # rather than against rendered headings — which is the
                  # stronger check anyway: it is the data, not the layout.
                  earnings=$(curl -fsS -b "$seller" -c "$seller" "$base/seller/earnings")
                  echo "$earnings" | grep -q '"component":"Earnings"'
                  echo "$earnings" | grep -q '"paidOutMinor":7920'
                  echo "$earnings" | grep -q '"netBalanceMinor":-3960'
                  echo "$earnings" | grep -q '"reason":"negative_balance"'
                  echo "$earnings" | grep -q '"canRequest":false'
                  # The statement is the ledger, and it names the order.
                  echo "$earnings" | grep -q '"typeLabel":"Payout"'
                  echo "$earnings" | grep -q '"referenceKind":"order"'

                  detail=$(curl -fsS -b "$seller" -c "$seller" "$base/seller/payouts/${payout}")
                  echo "$detail" | grep -q "${payout}"
                  echo "$detail" | grep -q '"status":"paid"'
                  echo "$detail" | grep -q '"settlementReference":"CI-FT-0001"'
                  # §6: the allocations say which earnings funded it, and
                  # they settled rather than being released.
                  echo "$detail" | grep -q '"allocations":\[{"id"'
                  echo "$detail" | grep -q '"statusLabel":"Settled"'
                  # §20: the seller is never shown provider internals.
                  ! echo "$detail" | grep -q '"providerReference"'

                  # A stranger reaches neither, and a payout reference is
                  # not a credential (§116).
                  stranger=$(mktemp)
                  curl -fsS -b "$stranger" -c "$stranger" -o /dev/null "$base/login"
                  curl -s -b "$stranger" -c "$stranger" -o /dev/null -X POST "$base/login" \
                      -H "X-XSRF-TOKEN: $(xsrf "$stranger")" \
                      -d 'email=m4-stranger@veritas.test' -d 'password=m4-smoke-password'

                  test "$(curl -s -b "$stranger" -o /dev/null -w '%{http_code}' "$base/seller/payouts/${payout}")" = "404"
                  test "$(curl -s -o /dev/null -w '%{http_code}' "$base/seller/payouts/${payout}")" = "302"
                  test "$(curl -s -o /dev/null -w '%{http_code}' "$base/admin/payouts/${payout}")" = "302"

                  # §114 and §115: finance pages are never a search result.
                  for path in "/seller/earnings" "/seller/payouts" "/seller/payouts/${payout}"; do
                      curl -sD - -o /dev/null -b "$seller" "${base}${path}" | grep -qi 'X-Robots-Tag: noindex, nofollow'
                  done

                  # And a seller session is not an admin session: with a
                  # valid CSRF token, so this proves authorisation rather
                  # than proving the token check works.
                  test "$(curl -s -b "$seller" -c "$seller" -o /dev/null -w '%{http_code}' -X POST \
                      "$base/admin/payouts/${payout}/approve" \
                      -H "X-XSRF-TOKEN: $(xsrf "$seller")")" = "302"

            - name: Reviews, recommendations and analytics run in the built image
              run: |
                  # The trust and insight layer against the container's real
                  # PostgreSQL and Redis, through the same actions and
                  # services the storefront and portals call. Nothing in the
                  # script inserts a review, a rating summary, a popularity
                  # score or a daily metric by hand.
                  docker compose exec -T app php artisan tinker --execute \
                      'require "/var/www/html/.github/ci/m8-trust-smoke.php";' > m8.txt
                  cat m8.txt

                  # §4: the verified badge is established from the order
                  # record, and the order item behind it is set by the
                  # server rather than sent by anybody.
                  grep -q 'review id=.* verified=yes status=published order_item=set' m8.txt

                  # §5: a customer with no purchase behind them is refused,
                  # and the reason names why rather than being generic.
                  grep -q 'unverified reason=not_purchased' m8.txt

                  # §14: one canonical product has ONE rating summary,
                  # however many sellers offer it.
                  grep -q 'rating offers=.* summaries=1 ' m8.txt

                  # §8 and §16: hiding a review takes it off the rating in
                  # the same moment, and restoring puts it back.
                  grep -q 'hidden changed=yes has_rating=no count=0' m8.txt
                  grep -q 'restored has_rating=yes count=1' m8.txt

                  # §30 and §31: a shelf never repeats a product because
                  # several sellers list it, never contains its own anchor,
                  # and never contains anything a shopper may not see.
                  grep -qE 'recommendations count=([0-9]+) distinct=\1 contains_anchor=no' m8.txt
                  grep -q 'recommendations ineligible=0' m8.txt

                  # §60: the rebuild is idempotent, and cannot alter a
                  # transactional or financial table.
                  grep -q 'reco_rebuild idempotent=yes transactional_unchanged=yes' m8.txt
                  grep -q 'reco_verify exit=0' m8.txt
                  grep -q 'analytics_verify exit=0' m8.txt

                  # §48 and §56: the daily money columns agree with M7's
                  # finance definitions to the penny.
                  grep -q 'analytics agrees=yes' m8.txt

                  # §17: and after all of it, the ratings still add up.
                  grep -q 'reconcile problems=0' m8.txt
                  grep -q 'reconcile_command Every product rating summary matches its reviews.' m8.txt
                  ! grep -q 'reconcile_problem' m8.txt

            - name: The trust and insight surfaces answer over HTTP and stay private
              run: |
                  base=http://127.0.0.1:8000
                  # The product the M8 smoke actually reviewed, so the
                  # page below genuinely has a review on it.
                  slug=$(grep '^product_slug=' m8.txt | cut -d= -f2 | tr -d '\r')
                  test -n "$slug"

                  # The product page carries its reviews, its rating and its
                  # shelves, and the JSON-LD quotes the same reviews the
                  # page shows (§16).
                  page=$(curl -fsS "$base/products/${slug}")
                  echo "$page" | grep -q '"reviews"'
                  echo "$page" | grep -q '"aggregateRating"'
                  echo "$page" | grep -q '"@type":"Review"'
                  echo "$page" | grep -q '"canWrite"'

                  # A signed-out visitor is told to sign in rather than
                  # shown a form the server would refuse.
                  echo "$page" | grep -q '"reason":"sign_in"'

                  # The wishlist is personal: signed out it redirects, and
                  # the response carries the noindex header even when SSR
                  # is misconfigured (§100).
                  test "$(curl -s -o /dev/null -w '%{http_code}' "$base/account/wishlist")" = "302"

                  # The admin surfaces need a session that may open them.
                  test "$(curl -s -o /dev/null -w '%{http_code}' "$base/admin/reviews")" = "302"
                  test "$(curl -s -o /dev/null -w '%{http_code}' "$base/admin/analytics")" = "302"
                  test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/admin/reviews/01JQQQQQQQQQQQQQQQQQQQQQQQ/hide" \
                      -d 'reason=trying it on')" = "302"

                  # And a customer session is not an admin session.
                  jar=$(mktemp)
                  xsrf() { grep XSRF-TOKEN "$jar" | awk '{print $7}' | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))'; }
                  curl -fsS -b "$jar" -c "$jar" -o /dev/null "$base/login"
                  curl -s -b "$jar" -c "$jar" -o /dev/null -X POST "$base/login" \
                      -H "X-XSRF-TOKEN: $(xsrf)" \
                      -d 'email=m4-customer@veritas.test' -d 'password=m4-smoke-password'

                  test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' "$base/admin/analytics")" = "302"
                  test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' "$base/seller/analytics")" = "302"

                  # Their own wishlist answers, and says noindex in the
                  # header rather than only in the markup.
                  test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' "$base/account/wishlist")" = "200"
                  curl -s -b "$jar" -D - -o /dev/null "$base/account/wishlist" \
                      | grep -qi 'x-robots-tag: *noindex'

            - name: Product rating summaries reconcile in the built image
              run: |
                  # Its own gate, like the finance one: a green test suite
                  # is not the same as a rating that adds up.
                  docker compose exec -T app php artisan reviews:reconcile-ratings

            - name: Seller finance reconciles in the built image
              run: |
                  # §89: the reconciliation is its own gate. A green test
                  # suite is not the same as a ledger that adds up.
                  docker compose exec -T app php artisan finance:reconcile-sellers

            - name: The inventory ledger reconciles in the built image
              run: |
                  # The stored `reserved` column is only safe because
                  # something checks it against the movements and the holds.
                  docker compose exec -T app php artisan inventory:reconcile

            - name: Security headers are set
              run: |
                  headers=$(curl -sD - -o /dev/null http://127.0.0.1:8000/)
                  echo "$headers" | grep -qi 'X-Frame-Options: DENY'
                  echo "$headers" | grep -qi "Content-Security-Policy: frame-ancestors 'none'; frame-src 'self' https://js.stripe.com https://hooks.stripe.com"
                  echo "$headers" | grep -qi 'X-Content-Type-Options: nosniff'
                  echo "$headers" | grep -qi 'Referrer-Policy: strict-origin-when-cross-origin'
                  # The portals are never a search result; the storefront is.
                  curl -sD - -o /dev/null http://127.0.0.1:8000/admin/login | grep -qi 'X-Robots-Tag: noindex'
                  ! curl -sD - -o /dev/null http://127.0.0.1:8000/ | grep -qi 'X-Robots-Tag'

            # The product page above proves SSR works by its output; this
            # says which process produced it, so a regression that quietly
            # fell back to client rendering is named rather than guessed at.
            - name: The SSR process is up and answering
              run: |
                  docker compose ps ssr | grep -qi 'up'
                  docker compose exec -T ssr node -e "
                    fetch('http://127.0.0.1:13714/health')
                      .then(r => { console.log('ssr health', r.status); process.exit(0); })
                      .catch(() => { console.log('ssr not listening'); process.exit(1); });
                  "

            - name: PostgreSQL answers from inside the application container
              run: |
                  docker compose exec -T app php artisan tinker --execute \
                      'echo "postgres reachable: ".\Illuminate\Support\Facades\DB::connection()->getPdo()->query("select 1")->fetchColumn();' \
                      | grep -q 'postgres reachable: 1'

            - name: Redis answers and the application can reach it
              run: |
                  docker compose exec -T redis redis-cli ping | grep -q PONG
                  docker compose exec -T app php artisan tinker --execute \
                      'echo Illuminate\Support\Facades\Redis::connection()->ping() ? "redis reachable" : "redis unreachable";' \
                      | grep -q 'redis reachable'

            - name: Every queue is drained by a worker
              run: |
                  docker compose up -d horizon
                  docker compose exec -T app php artisan horizon:status

                  # horizon:status says a supervisor is alive. This says
                  # work is actually picked up — a queue nobody listens to
                  # looks perfectly healthy from the dispatching side.
                  if ! docker compose exec -T app php artisan queues:smoke --timeout=60; then
                      docker compose logs horizon | tail -50
                      exit 1
                  fi

            # Retry and failure behaviour itself is covered against a real
            # Redis by tests/Feature/Infrastructure/QueueRuntimeTest in the
            # backend job. What the image has to prove is that the failed
            # table is there to receive one.
            - name: Failed jobs are recordable in the built image
              run: docker compose exec -T app php artisan queue:failed

            - name: Test database exists
              run: docker compose exec -T postgres psql -U veritas -lqt | grep -q veritas_test

            - name: Tear down
              if: always()
              run: docker compose down -v

    generated-files:
        name: Generated files are current
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, intl, bcmath
                  coverage: none

            - run: composer install --no-interaction --prefer-dist --no-progress

            - run: |
                  cp .env.example .env
                  php artisan key:generate

            # A status added to a PHP enum without regenerating the
            # TypeScript would render an unstyled badge in production. This
            # fails the build instead.
            - name: Status presentation map is up to date
              run: php artisan statuses:export --check
