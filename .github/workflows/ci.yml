name: CI

on:
    push:
        branches: ['**']
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: veritas_test
                    POSTGRES_USER: veritas
                    POSTGRES_PASSWORD: veritas
                ports: ['5432:5432']
                options: >-
                    --health-cmd="pg_isready -U veritas"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

            redis:
                image: redis:7
                ports: ['6379:6379']
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=5s
                    --health-timeout=3s
                    --health-retries=10

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, pgsql, redis, intl, bcmath, zip
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache
                  key: composer-${{ hashFiles('composer.lock') }}

            - run: composer install --no-interaction --prefer-dist --no-progress

            # The suite renders the product page through the real SSR
            # bundle in a node process, so the bundle has to exist here as
            # well as in the frontend job. Skipping the test instead would
            # mean a green suite that quietly stopped checking the markup a
            # crawler actually receives.
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - run: npm ci

            - name: Build the SSR bundle
              run: npm run build:ssr

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            # Migrations must run cleanly on an empty database, every time.
            - name: Migrate a clean database
              run: php artisan migrate:fresh --seed --force
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_DATABASE: veritas_test
                  DB_USERNAME: veritas
                  DB_PASSWORD: veritas

            - name: Code style
              run: ./vendor/bin/pint --test

            # Larastan installs normally on a runner, so this is the strict
            # configuration: level 8, with the Laravel-aware rules. The
            # level 6 fallback in phpstan.neon is never selected here and
            # cannot hide a finding from CI.
            - name: Static analysis
              run: |
                  test -f vendor/larastan/larastan/extension.neon \
                      || { echo "Larastan is missing; CI must run the strict configuration."; exit 1; }
                  php tools/phpstan.php analyse --memory-limit=2G --no-progress

            # The architectural invariants run first and on their own: if
            # money or tenant isolation is broken, nothing else in the suite
            # is interesting.
            - name: Architectural invariants
              run: ./vendor/bin/phpunit --testsuite=Invariants

            - name: Full test suite
              run: ./vendor/bin/phpunit

    frontend:
        name: Frontend
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - run: npm ci

            - name: Type check
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Production build
              run: npm run build:ssr

    docker:
        name: Docker environment
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Build images
              run: docker compose build

            - name: Start the stack
              run: |
                  cp .env.example .env
                  docker compose up -d postgres redis
                  docker compose run --rm app composer install --no-interaction --prefer-dist
                  docker compose run --rm app php artisan key:generate

                  # The storefront is server-rendered, so the SEO smoke
                  # below needs the SSR process as well as the PHP one.
                  # Enabled here rather than in .env.example because a
                  # developer without the bundle built should still get a
                  # working page.
                  echo 'INERTIA_SSR_ENABLED=true' >> .env
                  echo 'INERTIA_SSR_URL=http://ssr:13714' >> .env

                  docker compose run --rm vite sh -c 'npm ci && npm run build:ssr'
                  docker compose up -d ssr app
                  docker compose ps

            - name: Wait for the application to answer
              run: |
                  for attempt in $(seq 1 30); do
                    if curl -fsS http://127.0.0.1:8000/up > /dev/null; then
                      echo "Application is up after ${attempt} attempt(s)."
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "Application never became reachable."
                  docker compose logs app
                  exit 1

            - name: Migrate and smoke-test over HTTP
              run: |
                  docker compose exec -T app php artisan migrate:fresh --seed --force
                  curl -fsS -o /dev/null -w 'storefront %{http_code}\n' http://127.0.0.1:8000/
                  curl -fsS -o /dev/null -w 'sign in %{http_code}\n' http://127.0.0.1:8000/login
                  curl -fsS -o /dev/null -w 'register %{http_code}\n' http://127.0.0.1:8000/register
                  curl -fsS -o /dev/null -w 'admin login %{http_code}\n' http://127.0.0.1:8000/admin/login
                  curl -fsS -o /dev/null -w 'health %{http_code}\n' http://127.0.0.1:8000/up
                  # A guest is sent to the right sign-in page for the realm.
                  test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8000/admin)" = "http://127.0.0.1:8000/admin/login"
                  test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8000/seller)" = "http://127.0.0.1:8000/login"
                  # An unknown store is a 404, not a shell.
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/stores/nothing-here)" = "404"

            # The catalogue is the point of M2, so the built image has to
            # serve a real product page — not just the shell. A published
            # product is created through the same models the application
            # uses, then fetched the way a crawler would.
            - name: A canonical product page is served with its SEO markup
              run: |
                  # Written to a file first, deliberately. Piping the seed
                  # straight into `tr` discarded its exit status, so a
                  # seeding failure surfaced as a confusing curl error
                  # three steps later instead of a failed step.
                  docker compose exec -T app php artisan veritas:seed-demo-catalogue --offers=2 > seeded.txt
                  slug=$(grep '^product=' seeded.txt | cut -d= -f2 | tr -d '\r')
                  test -n "$slug"

                  body=$(curl -fsS "http://127.0.0.1:8000/products/${slug}")

                  # Server-rendered, so all of this is in the first
                  # response — which is the only one a crawler makes.
                  test "$(echo "$body" | grep -c '<title')" = "1"
                  echo "$body" | grep -q 'Aeris Cordless Kettle'
                  echo "$body" | grep -q 'rel="canonical"'
                  echo "$body" | grep -q 'application/ld+json'
                  echo "$body" | grep -q '"@type":"Product"'
                  # Truthfulness, not presence: nothing may claim a rating
                  # or a review the database cannot support.
                  ! echo "$body" | grep -q 'aggregateRating'
                  ! echo "$body" | grep -q '"review"'
                  # A storefront page is indexable; the portals are not.
                  ! curl -sD - -o /dev/null "http://127.0.0.1:8000/products/${slug}" | grep -qi 'X-Robots-Tag'
                  # Availability is the inventory ledger's answer, not an
                  # assumption: the seeded product is stocked, so a claim
                  # of OutOfStock here would mean the two have diverged.
                  echo "$body" | grep -q '"availability":"https://schema.org/InStock"'
                  # An unpublished product has no page at all.
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/products/not-a-real-product)" = "404"

            # M3's discovery surfaces, on the built image.
            - name: Search, category and store pages answer
              run: |
                  category=$(grep '^category=' seeded.txt | cut -d= -f2 | tr -d '\r')
                  store=$(grep '^store=' seeded.txt | cut -d= -f2 | tr -d '\r')

                  # The index is built by a queued job; the smoke runs it
                  # directly so it does not race the worker.
                  docker compose exec -T app php artisan tinker --execute \
                      'foreach (\App\Modules\Catalog\Models\Product::query()->pluck("id") as $id) { \App\Modules\Search\Jobs\ReindexProduct::dispatchSync((int) $id); }'

                  curl -fsS -o /dev/null -w 'category %{http_code}\n' "http://127.0.0.1:8000/categories/${category}"
                  curl -fsS -o /dev/null -w 'store %{http_code}\n' "http://127.0.0.1:8000/stores/${store}"

                  search=$(curl -fsS 'http://127.0.0.1:8000/search?q=Aeris')
                  echo "$search" | grep -q 'Aeris Cordless Kettle'

                  # Typo tolerance, on the real trigram index.
                  curl -fsS 'http://127.0.0.1:8000/search?q=Aeriss' | grep -q 'Aeris Cordless Kettle'

                  # Autocomplete answers, and only with published rows.
                  curl -fsS 'http://127.0.0.1:8000/search/suggestions?q=aer' | grep -q 'Aeris Cordless Kettle'

                  # Search is never indexable — the header survives even a
                  # misconfigured SSR process.
                  curl -sD - -o /dev/null 'http://127.0.0.1:8000/search?q=Aeris' | grep -qi 'X-Robots-Tag: noindex'

                  # A clean category page is the canonical thing; a faceted
                  # one is not, or one category becomes six hundred pages.
                  curl -fsS "http://127.0.0.1:8000/categories/${category}" | grep -q 'content="index, follow"'
                  curl -fsS "http://127.0.0.1:8000/categories/${category}?in_stock=1" | grep -q 'content="noindex, follow"'

            - name: Sitemaps list only what resolves
              run: |
                  slug=$(grep '^product=' seeded.txt | cut -d= -f2 | tr -d '\r')

                  curl -fsS http://127.0.0.1:8000/sitemap.xml | grep -q 'products-sitemap.xml'
                  curl -fsS http://127.0.0.1:8000/products-sitemap.xml | grep -q "/products/${slug}"
                  curl -fsS http://127.0.0.1:8000/categories-sitemap.xml | grep -q '/categories/'
                  curl -fsS http://127.0.0.1:8000/stores-sitemap.xml | grep -q '/stores/'

                  # Nothing a crawler should not be asking for.
                  ! curl -fsS http://127.0.0.1:8000/products-sitemap.xml | grep -q '/search'
                  ! curl -fsS http://127.0.0.1:8000/products-sitemap.xml | grep -q '/admin'

                  curl -fsS http://127.0.0.1:8000/robots.txt | grep -q 'Disallow: /search'
                  curl -fsS http://127.0.0.1:8000/robots.txt | grep -q 'Sitemap: '

            - name: The inventory ledger reconciles in the built image
              run: |
                  # The stored `reserved` column is only safe because
                  # something checks it against the movements and the holds.
                  docker compose exec -T app php artisan inventory:reconcile

            - name: Security headers are set
              run: |
                  headers=$(curl -sD - -o /dev/null http://127.0.0.1:8000/)
                  echo "$headers" | grep -qi 'X-Frame-Options: DENY'
                  echo "$headers" | grep -qi "Content-Security-Policy: frame-ancestors 'none'"
                  echo "$headers" | grep -qi 'X-Content-Type-Options: nosniff'
                  echo "$headers" | grep -qi 'Referrer-Policy: strict-origin-when-cross-origin'
                  # The portals are never a search result; the storefront is.
                  curl -sD - -o /dev/null http://127.0.0.1:8000/admin/login | grep -qi 'X-Robots-Tag: noindex'
                  ! curl -sD - -o /dev/null http://127.0.0.1:8000/ | grep -qi 'X-Robots-Tag'

            # The product page above proves SSR works by its output; this
            # says which process produced it, so a regression that quietly
            # fell back to client rendering is named rather than guessed at.
            - name: The SSR process is up and answering
              run: |
                  docker compose ps ssr | grep -qi 'up'
                  docker compose exec -T ssr node -e "
                    fetch('http://127.0.0.1:13714/health')
                      .then(r => { console.log('ssr health', r.status); process.exit(0); })
                      .catch(() => { console.log('ssr not listening'); process.exit(1); });
                  "

            - name: PostgreSQL answers from inside the application container
              run: |
                  docker compose exec -T app php artisan tinker --execute \
                      'echo "postgres reachable: ".\Illuminate\Support\Facades\DB::connection()->getPdo()->query("select 1")->fetchColumn();' \
                      | grep -q 'postgres reachable: 1'

            - name: Redis answers and the application can reach it
              run: |
                  docker compose exec -T redis redis-cli ping | grep -q PONG
                  docker compose exec -T app php artisan tinker --execute \
                      'echo Illuminate\Support\Facades\Redis::connection()->ping() ? "redis reachable" : "redis unreachable";' \
                      | grep -q 'redis reachable'

            - name: Every queue is drained by a worker
              run: |
                  docker compose up -d horizon
                  docker compose exec -T app php artisan horizon:status

                  # horizon:status says a supervisor is alive. This says
                  # work is actually picked up — a queue nobody listens to
                  # looks perfectly healthy from the dispatching side.
                  if ! docker compose exec -T app php artisan queues:smoke --timeout=60; then
                      docker compose logs horizon | tail -50
                      exit 1
                  fi

            # Retry and failure behaviour itself is covered against a real
            # Redis by tests/Feature/Infrastructure/QueueRuntimeTest in the
            # backend job. What the image has to prove is that the failed
            # table is there to receive one.
            - name: Failed jobs are recordable in the built image
              run: docker compose exec -T app php artisan queue:failed

            - name: Test database exists
              run: docker compose exec -T postgres psql -U veritas -lqt | grep -q veritas_test

            - name: Tear down
              if: always()
              run: docker compose down -v

    generated-files:
        name: Generated files are current
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, intl, bcmath
                  coverage: none

            - run: composer install --no-interaction --prefer-dist --no-progress

            - run: |
                  cp .env.example .env
                  php artisan key:generate

            # A status added to a PHP enum without regenerating the
            # TypeScript would render an unstyled badge in production. This
            # fails the build instead.
            - name: Status presentation map is up to date
              run: php artisan statuses:export --check
