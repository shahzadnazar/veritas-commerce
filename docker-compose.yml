# Local development environment.
#
# Postgres, Redis, the application, the asset server and a queue worker.
# There is no search cluster or object store here: development uses the
# local disk and the Postgres search adapter, and both sit behind the same
# interfaces the production drivers do.

services:
    app:
        build:
            context: .
            dockerfile: docker/app.Dockerfile
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - '${APP_PORT:-8000}:8000'
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: php artisan serve --host=0.0.0.0 --port=8000

    # Horizon rather than a bare `queue:work`, because the supervisors are
    # the point: five queues with their own pools, so image processing
    # cannot delay a payment webhook. It reads config/horizon.php, which is
    # the same file production uses.
    horizon:
        build:
            context: .
            dockerfile: docker/app.Dockerfile
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
            QUEUE_CONNECTION: redis
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: php artisan horizon
        healthcheck:
            test: ['CMD', 'php', 'artisan', 'horizon:status']
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s
        restart: unless-stopped

    vite:
        build:
            context: .
            dockerfile: docker/node.Dockerfile
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - /var/www/html/node_modules
        ports:
            - '${VITE_PORT:-5173}:5173'
        command: npm run dev -- --host 0.0.0.0

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-veritas}
            POSTGRES_USER: ${DB_USERNAME:-veritas}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-veritas}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
            # A second database for the test suite, created on first boot.
            - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-veritas}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres-data:
    redis-data:
