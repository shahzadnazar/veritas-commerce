# Local development environment.
#
# Postgres and Redis are the two services the application genuinely needs;
# there is no queue broker, search cluster or object store here because M0
# does not use one. They arrive when the milestone that needs them does.

services:
    app:
        build:
            context: .
            dockerfile: docker/app.Dockerfile
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - '${APP_PORT:-8000}:8000'
        environment:
            DB_HOST: postgres
            REDIS_HOST: redis
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: php artisan serve --host=0.0.0.0 --port=8000

    vite:
        build:
            context: .
            dockerfile: docker/node.Dockerfile
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - /var/www/html/node_modules
        ports:
            - '${VITE_PORT:-5173}:5173'
        command: npm run dev -- --host 0.0.0.0

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-veritas}
            POSTGRES_USER: ${DB_USERNAME:-veritas}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-veritas}
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
            # A second database for the test suite, created on first boot.
            - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-veritas}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres-data:
    redis-data:
